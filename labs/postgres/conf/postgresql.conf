# Configuração do laboratório: próxima de produção, com tudo que o curso observa ligado.
listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 256MB

# Extensões de observação (Nível 4)
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
track_io_timing = on

# WAL, arquivamento e PITR (Nível 4)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /arquivo_wal/%f && cp %p /arquivo_wal/%f'
archive_timeout = 60
max_wal_size = 2GB
checkpoint_timeout = 5min

# Logs que ajudam nos incidentes
log_min_duration_statement = '500ms'
log_lock_waits = on
deadlock_timeout = 1s
log_autovacuum_min_duration = 0
log_temp_files = 0
log_line_prefix = '%m [%p] %u@%d '

# Proteções (deixe comentadas para conseguir reproduzir os incidentes)
#idle_in_transaction_session_timeout = '5min'
#statement_timeout = '30s'
